[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sonar-paper"
version = "0.2.0"
description = "SoNAR implementation, final method inputs, and reproducibility tools"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.3"]

[project.optional-dependencies]
inference = ["torch==2.4.0", "msclap==1.3.4", "transformers==4.57.6", "pykeen==1.11.1", "pandas", "tqdm", "accelerate", "psutil"]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["sonar*", "experiments*"]
