[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "saki-paper"
version = "0.1.0"
description = "Paper-result SAKI implementation and reproducibility package"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy"]

[project.optional-dependencies]
inference = ["torch==2.4.0", "msclap==1.3.4", "transformers==4.57.6", "pykeen==1.11.1", "pandas", "tqdm", "accelerate"]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["saki*", "experiments*"]
